<!DOCTYPE html>
<!--
  Study Buddy frontend -- deliberately boring.

  One static file, vanilla JS, a fetch() to the FastAPI backend. There is no
  build step and no framework on purpose: the AI concept should be the only
  thing competing for attention in the room.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Study Buddy</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      max-width: 720px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5;
    }
    h1 { margin-bottom: 0.25rem; }
    .version { color: #888; font-size: 0.85rem; margin-top: 0; }
    textarea {
      width: 100%; box-sizing: border-box; min-height: 90px; padding: 0.6rem;
      font: inherit; border: 1px solid #bbb; border-radius: 8px; resize: vertical;
    }
    button {
      margin-top: 0.5rem; padding: 0.55rem 1.1rem; font: inherit; cursor: pointer;
      border: 1px solid #666; border-radius: 8px; background: #eee;
    }
    button:disabled { opacity: 0.5; cursor: default; }
    #answer {
      white-space: pre-wrap; border: 1px solid #bbb; border-radius: 8px;
      padding: 0.8rem; margin-top: 1rem; min-height: 2rem; background: rgba(127,127,127,0.06);
    }
    .hint { color: #888; font-size: 0.85rem; }
  </style>
</head>
<body>
  <h1>Study Buddy</h1>
  <p class="version">v0 &mdash; raw one-shot Q&amp;A</p>

  <textarea id="question" placeholder="Ask me anything..."></textarea>
  <br />
  <button id="send">Ask</button>
  <span class="hint" id="status"></span>

  <div id="answer" hidden></div>

  <script>
    const questionEl = document.getElementById("question");
    const buttonEl = document.getElementById("send");
    const answerEl = document.getElementById("answer");
    const statusEl = document.getElementById("status");

    async function ask() {
      const question = questionEl.value.trim();
      if (!question) return;

      buttonEl.disabled = true;
      statusEl.textContent = "thinking...";
      answerEl.hidden = true;

      try {
        const res = await fetch("/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question }),
        });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        answerEl.textContent = data.answer;
        answerEl.hidden = false;
      } catch (err) {
        answerEl.textContent = "Error: " + err.message;
        answerEl.hidden = false;
      } finally {
        buttonEl.disabled = false;
        statusEl.textContent = "";
      }
    }

    buttonEl.addEventListener("click", ask);
    // Ctrl/Cmd+Enter also sends.
    questionEl.addEventListener("keydown", (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === "Enter") ask();
    });
  </script>
</body>
</html>
