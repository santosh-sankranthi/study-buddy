[pytest]
norecursedirs = .venv scripts app/versions
testpaths = phases
# The curriculum self-checks are `solution/check.py` scripts, collected by the
# root conftest.py. Do not let the default collector pick them up as modules
# (all share the basename `check`, which collides under the default import mode).
python_files = test_*.py *_test.py
markers =
    llm: self-check makes a live LLM/embedding call (skipped unless --run-llm-checks)
